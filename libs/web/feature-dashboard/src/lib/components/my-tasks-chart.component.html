<mat-card class="tasks-chart-card">
  <mat-card-header>
    <mat-card-title>Task status</mat-card-title>
    <mat-card-subtitle>{{ userName() }} — todo, in progress, and completed</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="tasks-chart-card__canvas-wrap">
      <canvas #chartCanvas aria-label="Bar chart of my tasks by status"></canvas>
    </div>
    <div class="tasks-chart-card__legend">
      <span class="legend-item legend-item--todo">
        <span class="legend-dot"></span>
        To Do ({{ stats().todo }})
      </span>
      <span class="legend-item legend-item--progress">
        <span class="legend-dot"></span>
        In Progress ({{ stats().in_progress }})
      </span>
      <span class="legend-item legend-item--done">
        <span class="legend-dot"></span>
        Done ({{ stats().done }})
      </span>
    </div>
  </mat-card-content>
</mat-card>
