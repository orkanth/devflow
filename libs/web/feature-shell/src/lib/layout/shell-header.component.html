<mat-toolbar class="shell-header">
  <button
    mat-icon-button
    type="button"
    aria-label="Toggle navigation"
    (click)="menuToggle.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="shell-header__brand">
    <mat-icon class="shell-header__logo">hub</mat-icon>
    DevFlow
  </span>

  <span class="shell-header__spacer"></span>

  <button mat-icon-button type="button" aria-label="Notifications">
    <mat-icon>notifications</mat-icon>
  </button>

  <button
    mat-button
    type="button"
    class="shell-header__user-btn"
    [matMenuTriggerFor]="userMenu"
  >
    <mat-icon>account_circle</mat-icon>
    <span class="shell-header__user-name">
      {{ currentUser()?.name ?? 'User' }}
    </span>
  </button>

  <mat-menu #userMenu="matMenu">
    @if (currentUser(); as user) {
      <div class="shell-header__menu-header">
        <strong>{{ user.name }}</strong>
        <span>{{ user.email }}</span>
      </div>
      <mat-divider />
    }

    <button mat-menu-item disabled>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>

    <mat-divider />
    <div class="shell-header__menu-label">Switch user (demo)</div>
    @for (user of users(); track user.id) {
      <button
        mat-menu-item
        type="button"
        (click)="switchUser(user.id)"
        [disabled]="currentUser()?.id === user.id"
      >
        <mat-icon>swap_horiz</mat-icon>
        <span>{{ user.name }}</span>
      </button>
    }
  </mat-menu>
</mat-toolbar>
